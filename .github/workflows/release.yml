name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      # Nothing is publishable until there are sources to bundle: `dist/` is built here and
      # never committed, so publishing without `src/` would ship a package with no entry
      # point. The guard becomes permanently true once sources land; delete it then.
      - name: Build
        if: hashFiles('src/**/*.ts') != ''
        run: pnpm run build
      - name: Authenticate against GitHub Packages
        if: hashFiles('src/**/*.ts') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm config set //npm.pkg.github.com/:_authToken "${GITHUB_TOKEN}"
      - name: Semantic Release
        if: hashFiles('src/**/*.ts') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: pnpm exec semantic-release

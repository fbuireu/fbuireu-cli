name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
        with:
          registry-url: 'https://registry.npmjs.org'
      # verify ends in the bundle, and is guarded the same way: nothing is publishable until
      # there are sources to bundle, since `dist/` is built here and never committed. The
      # guard inside verify becomes permanently true once sources land; delete it then.
      - name: Verify
        run: pnpm verify
      - name: Authenticate against GitHub Packages
        if: hashFiles('src/**/*.ts') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm config set //npm.pkg.github.com/:_authToken "${GITHUB_TOKEN}"
      - name: Semantic Release
        if: hashFiles('src/**/*.ts') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: pnpm exec semantic-release

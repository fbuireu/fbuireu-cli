name: Feature Request
description: Suggest an idea or enhancement
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        A heads-up before you write: this project's scope is deliberately closed — it introduces one person to a stranger in under a minute, and features outside that (games, analytics, configuration) are out of scope by design. Ideas inside that scope are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What does the current CLI fail to do for a visitor?
      placeholder: As a visitor, I couldn't...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions you've considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a PR to implement this feature
